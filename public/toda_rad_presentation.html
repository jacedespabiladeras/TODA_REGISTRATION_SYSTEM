<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapid Application Development (RAD) Model</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .card {
            max-width: 1200px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            padding: 3.5rem 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title {
            font-size: 2.25rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 2.5rem;
            text-align: center;
            letter-spacing: -0.02em;
        }

        .diagram-box {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: auto;
            overflow: visible;
        }

        .actions {
            margin-top: 3rem;
            display: flex;
            gap: 1rem;
        }

        .btn {
            background-color: #0f2744;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            border-radius: 9999px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #1e3a8a;
            transform: translateY(-1px);
        }

        @media print {
            body { background: white; padding: 0; }
            .card { box-shadow: none; border: none; padding: 0; }
            .actions { display: none; }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="title">Rapid Application Development (RAD)</h1>

        <div class="diagram-box">
            <svg viewBox="0 0 1100 320" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <marker id="navyArrowHead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 1 2 L 8 5 L 1 8 z" fill="#0f2744"/>
                    </marker>
                    <filter id="softShadow" x="-2%" y="-5%" width="104%" height="115%" filterUnits="userSpaceOnUse">
                        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
                    </filter>
                </defs>

                <!-- Continuous Arrow Banner Group -->
                <g filter="url(#softShadow)">
                    <!-- 1. Requirements Planning Banner (White / Soft Light Navy Tint with Chevron) -->
                    <path d="M 40 105 L 10 160 L 40 215 L 430 215 L 430 105 Z" fill="#edf2f9"/>
                    <text x="215" y="148" fill="#0f2744" font-size="20" font-weight="800" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif">Requirements</text>
                    <text x="215" y="178" fill="#0f2744" font-size="20" font-weight="800" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif">Planning</text>

                    <!-- 3. Construction Banner (Vibrant Navy Chevron Arrow) -->
                    <path d="M 430 105 L 810 105 L 860 160 L 810 215 L 430 215 Z" fill="#0d47a1"/>
                    <text x="685" y="167" fill="#ffffff" font-size="21" font-weight="800" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif">Construction</text>

                    <!-- 4. Cutover Banner (Deep Dark Navy Chevron Arrow) -->
                    <path d="M 818 105 L 990 105 L 1050 160 L 990 215 L 818 215 L 868 160 Z" fill="#0a192f"/>
                    <text x="945" y="167" fill="#ffffff" font-size="21" font-weight="800" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif">Cutover</text>
                </g>

                <!-- 2. User Design (Central Circle and Exact Curved Iterative Loop) -->
                <g transform="translate(480, 160)">
                    <!-- Center White Circle with Navy Border -->
                    <circle cx="0" cy="0" r="90" fill="#ffffff" stroke="#0a192f" stroke-width="3.5" filter="url(#softShadow)"/>
                    <text x="0" y="-8" text-anchor="middle" font-size="24" font-weight="800" fill="#0a192f" font-family="'Plus Jakarta Sans', sans-serif">User</text>
                    <text x="0" y="24" text-anchor="middle" font-size="24" font-weight="800" fill="#0a192f" font-family="'Plus Jakarta Sans', sans-serif">Design</text>

                    <!-- Curved Feedback Loop Arrows -->
                    <!-- Top Arc: pointing to Prototype -->
                    <path d="M -115 15 A 120 120 0 0 1 -45 -110" fill="none" stroke="#0a192f" stroke-width="3" stroke-linecap="round" marker-end="url(#navyArrowHead)"/>
                    <text x="0" y="-128" text-anchor="middle" font-size="16" font-weight="700" fill="#0a192f" font-family="'Plus Jakarta Sans', sans-serif">Prototype</text>

                    <!-- Right Arc: pointing down to Test -->
                    <path d="M 50 -110 A 120 120 0 0 1 115 25" fill="none" stroke="#0a192f" stroke-width="3" stroke-linecap="round" marker-end="url(#navyArrowHead)"/>
                    <text x="110" y="75" text-anchor="start" font-size="16" font-weight="700" fill="#0a192f" font-family="'Plus Jakarta Sans', sans-serif">Test</text>

                    <!-- Bottom-Left Arc: pointing up to Refine -->
                    <path d="M 90 80 A 120 120 0 0 1 -90 80" fill="none" stroke="#0a192f" stroke-width="3" stroke-linecap="round" marker-end="url(#navyArrowHead)"/>
                    <text x="-110" y="75" text-anchor="end" font-size="16" font-weight="700" fill="#0a192f" font-family="'Plus Jakarta Sans', sans-serif">Refine</text>
                </g>
            </svg>
        </div>

        <div class="actions">
            <button class="btn" onclick="window.print()">Print / Export Slide</button>
        </div>
    </div>

</body>
</html>
